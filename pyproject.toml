[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsforge"
version = "0.1.0"
description = "Comment-annotation driven documentation generator. Scan 'docs:' source annotations to produce Markdown, tables, and drift checks — language agnostic, handler-pluggable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "atnwang@qq.com" }]
keywords = ["documentation", "docs-as-code", "annotations", "docgen", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
docsforge = "docsforge.cli:main"

[tool.setuptools.packages.find]
include = ["docsforge*"]

[tool.setuptools.package-data]
docsforge = ["py.typed"]
